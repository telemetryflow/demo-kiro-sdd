# =============================================================================
# Loki Configuration - Order Service Log Aggregation
# =============================================================================
# Receives OTLP logs natively (Loki 3.x) at /otlp/v1/logs from TFO-Collector.
# traceId is stored as structured metadata for Grafana metrics/logs/traces correlation.
# Single-node filesystem storage (demo profile). For production use S3/GCS backend.
# =============================================================================

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Schema config - tsdb schema supports structured metadata (traceId correlation)
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  chunk_idle_period: 30m
  chunk_target_size: 1572864
  max_chunk_age: 1h
  wal:
    enabled: true
    dir: /loki/wal

limits_config:
  retention_period: 168h            # 7 days
  max_global_streams_per_user: 0
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  # Allow OTLP resource attributes as structured metadata
  allow_structured_metadata: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Promote OTLP resource attributes to stream labels so dashboards can filter
  # with stream selectors like {service_name="Order-Service"}.
  otlp_resource_attributes:
    attributes_config:
      - action: index_label
        attributes:
          - service.name
          - service.namespace
          - deployment.environment
          - service.version

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true

analytics:
  reporting_enabled: false
