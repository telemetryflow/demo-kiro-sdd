# =============================================================================
# Prometheus Configuration - Order Service Observability
# =============================================================================
# Scrapes metrics from TFO-Collector with exemplars support.
# Exemplars (trace_id on span_metrics histograms) enable click-through from
# a metric sample directly to the trace in Jaeger via the Grafana datasource.
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'Order-Service'

# Rule files for recording and alerting rules
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Scrape configurations
scrape_configs:
  # TFO-Collector derived metrics (span_metrics + service_graph + app metrics).
  # The prometheus exporter lives on 8889 and emits OpenMetrics with exemplars.
  - job_name: 'tfo-collector'
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 8s
    static_configs:
      - targets: ['tfo-collector:8889']
        labels:
          source: 'prometheus-exporter'
    enable_http2: true

  # TFO-Collector internal telemetry (collector's own health/perf).
  - job_name: 'tfo-collector-internal'
    scrape_interval: 15s
    static_configs:
      - targets: ['tfo-collector:8888']
        labels:
          source: 'internal-telemetry'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']
